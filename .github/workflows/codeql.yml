name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC — off-peak, offset from the hour to avoid GitHub's
    # scheduled-workflow rush.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
